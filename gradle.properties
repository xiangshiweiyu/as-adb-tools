# Gradle 运行参数（系统页面文件紧张：SerialGC + 最小初始堆 + 关闭 C2，最大程度降低虚拟内存占用）
org.gradle.jvmargs=-Xmx512m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2

# Kotlin 守护进程单独分配堆内存，避免全量编译时 OOM
kotlin.daemon.jvmargs=-Xmx1024m -XX:ReservedCodeCacheSize=64m

# 平台自带 kotlin-stdlib，避免重复打入插件包
kotlin.stdlib.default.dependency=false
